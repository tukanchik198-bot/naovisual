<script id="nao-ui-script">

naoAuthView').hidden=true;id('naoProfileView').hidden=false;openO();}function msg(i,t,ok){var e=id(i);e.textContent=t;e.style.color=ok?'#4ade80':'#f87171';}document.addEventListener('click',function(ev){var tg=ev.target;if(tg&&(tg.id==='naoOverlay'||tg.className==='nao-center')){closeO();return;}var t=tg.closest?tg.closest('[data-act],[data-tab]'):null;if(!t)return;var tab=t.getAttribute('data-tab');if(tab){ev.preventDefault();setTab(tab);return;}var act=t.getAttribute('data-act');if(act==='open-auth'){ev.preventDefault();showAuth('login');}else if(act==='open-profile'){ev.preventDefault();showProfile();}else if(act==='logout'){ev.preventDefault();localStorage.removeItem(SESS);render();closeO();}else if(act==='close'){ev.preventDefault();closeO();}else if(act==='register'){ev.preventDefault();var un=id('naoRegUn').value.trim(),em=id('naoRegEm').value.trim(),pw=id('naoRegPw').value,pw2=id('naoRegPw2').value;if(!un||!em||!pw){msg('naoRegErr','Заполните все поля');return;}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){msg('naoRegErr','Некорректный email');return;}if(pw!==pw2){msg('naoRegErr','Пароли не совпадают');return;}if(pw.length<4){msg('naoRegErr','Пароль слишком короткий (мин. 4)');return;}var us=loadUsers();for(var k in us){if(us[k].username.toLowerCase()===un.toLowerCase()){msg('naoRegErr','Логин уже занят');return;}if((us[k].email||'').toLowerCase()===em.toLowerCase()){msg('naoRegErr','Почта уже используется');return;}}var salt=Math.random().toString(36).slice(2);us[un]={username:un,email:em,salt:salt,hash:hash(salt,pw),created:Date.now(),sub:null,hwid:'NVV-'+Math.random().toString(36).slice(2,10).toUpperCase()};saveUsers(us);localStorage.setItem(SESS,un);render();msg('naoRegErr','Аккаунт создан!',true);setTimeout(showProfile,450);}else if(act==='login'){ev.preventDefault();var iv=id('naoLoginId').value.trim(),p=id('naoLoginPw').value,us=loadUsers(),f=null;for(var k in us){if(us[k].username.toLowerCase()===iv.toLowerCase()||(us[k].email||'').toLowerCase()===iv.to
