<script id="nao-ui-script">
(function(){if(document.getElementById('__auth_panel'))return;var USERS='nao_users',SESS='nao_session';function id(x){return document.getElementById(x);}function loadUsers(){try{return JSON.parse(localStorage.getItem(USERS))||{};}catch(e){return {};}}function saveUsers(u){localStorage.setItem(USERS,JSON.stringify(u));}function hash(salt,pw){var str=salt+'::'+pw,h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return ('00000000'+h.toString(16)).slice(-8)+str.length.toString(16);}function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function cur(){return localStorage.getItem(SESS)||'';}function render(){var b=id('naoAuthBtn'),u=cur();b.innerHTML=u?('<a href="#" data-act="open-profile">'+esc(u)+'</a><button class="nao-out" data-act="logout">Выйти</button>'):'<button data-act="open-auth">Войти</button>';}function openO(){id('naoOverlay').classList.add('open');document.documentElement.style.overflow='hidden';}function closeO(){id('naoOverlay').classList.remove('open');document.documentElement.style.overflow='';}function setTab(t){var isL=t==='login';id('naoPaneLogin').hidden=!isL;id('naoPaneReg').hidden=isL;var tabs=document.querySelectorAll('.nao-tab');for(var i=0;i<tabs.length;i++)tabs[i].className='nao-tab'+(tabs[i].getAttribute('data-tab')===t?' active':'');id('naoLoginErr').textContent='';id('naoRegErr').textContent='';}function showAuth(t){id('naoProfileView').hidden=true;id('naoAuthView').hidden=false;setTab(t||'login');openO();}function showProfile(){var u=loadUsers()[cur()];if(!u){localStorage.removeItem(SESS);render();showAuth('login');return;}id('pLogin').textContent=u.username;id('pEmail').textContent=u.email||'—';id('pCreated').textContent=u.created?new Date(u.created).toLocaleString('ru-RU'):'—';id('pSub').textContent=u.sub||'Нет подписки';id('pHwid').textContent=u.hwid||'—';id('pCount').textContent=String(Object.keys(loadUsers()).length);id('naoAuthView').hidden=true;id('naoProfileView').hidden=false;openO();}function msg(i,t,ok){var e=id(i);e.textContent=t;e.style.color=ok?'#4ade80':'#f87171';}document.addEventListener('click',function(ev){var tg=ev.target;if(tg&&(tg.id==='naoOverlay'||tg.className==='nao-center')){closeO();return;}var t=tg.closest?tg.closest('[data-act],[data-tab]'):null;if(!t)return;var tab=t.getAttribute('data-tab');if(tab){ev.preventDefault();setTab(tab);return;}var act=t.getAttribute('data-act');if(act==='open-auth'){ev.preventDefault();showAuth('login');}else if(act==='open-profile'){ev.preventDefault();showProfile();}else if(act==='logout'){ev.preventDefault();localStorage.removeItem(SESS);render();closeO();}else if(act==='close'){ev.preventDefault();closeO();}else if(act==='register'){ev.preventDefault();var un=id('naoRegUn').value.trim(),em=id('naoRegEm').value.trim(),pw=id('naoRegPw').value,pw2=id('naoRegPw2').value;if(!un||!em||!pw){msg('naoRegErr','Заполните все поля');return;}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){msg('naoRegErr','Некорректный email');return;}if(pw!==pw2){msg('naoRegErr','Пароли не совпадают');return;}if(pw.length<4){msg('naoRegErr','Пароль слишком короткий (мин. 4)');return;}var us=loadUsers();for(var k in us){if(us[k].username.toLowerCase()===un.toLowerCase()){msg('naoRegErr','Логин уже занят');return;}if((us[k].email||'').toLowerCase()===em.toLowerCase()){msg('naoRegErr','Почта уже используется');return;}}var salt=Math.random().toString(36).slice(2);us[un]={username:un,email:em,salt:salt,hash:hash(salt,pw),created:Date.now(),sub:null,hwid:'NVV-'+Math.random().toString(36).slice(2,10).toUpperCase()};saveUsers(us);localStorage.setItem(SESS,un);render();msg('naoRegErr','Аккаунт создан!',true);setTimeout(showProfile,450);}else if(act==='login'){ev.preventDefault();var iv=id('naoLoginId').value.trim(),p=id('naoLoginPw').value,us=loadUsers(),f=null;for(var k in us){if(us[k].username.toLowerCase()===iv.toLowerCase()||(us[k].email||'').toLowerCase()===iv.toLowerCase()){f=us[k];break;}}if(!f){msg('naoLoginErr','Пользователь не найден');return;}if(hash(f.salt,p)!==f.hash){msg('naoLoginErr','Неверный пароль');return;}localStorage.setItem(SESS,f.username);render();showProfile();}else if(act==='changepw'){ev.preventDefault();var u=loadUsers()[cur()];if(!u)return;var c=prompt('Текущий пароль:');if(c===null)return;if(hash(u.salt,c)!==u.hash){alert('Неверный текущий пароль');return;}var np=prompt('Новый пароль:');if(!np)return;if(np.length<4){alert('Слишком короткий');return;}var u2=loadUsers();u2[u.username].salt=Math.random().toString(36).slice(2);u2[u.username].hash=hash(u2[u.username].salt,np);saveUsers(u2);alert('Пароль изменён');}});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeO();});render();})();</script>
